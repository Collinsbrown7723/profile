<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fortress Digital | Engineering the Future with AI & Telecom</title> 
    
    <!-- Google Fonts + Font Awesome 6 (Free) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --deep-space: #050914;
            --cosmic-blue: #0a192f;
            --neon-cyan: #00f0ff;
            --neon-purple: #8b5cf6;
            --glow-blue: #3b82f6;
            --text-white: #f1f5f9;
            --text-dim: #94a3b8;
            --glass-bg: rgba(15, 25, 45, 0.65);
            --glass-border: rgba(0, 240, 255, 0.2);
            --transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--deep-space);
            color: var(--text-white);
            overflow-x: hidden;
            line-height: 1.5;
        }

        /* animated grid background */
        .bg-orb {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(0, 240, 255, 0.08), transparent 60%),
                        radial-gradient(circle at 85% 70%, rgba(139, 92, 246, 0.08), transparent 70%);
            pointer-events: none;
            z-index: -2;
        }

        /* custom scroll */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0f1a; }
        ::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 10px; }

        /* ========= MODERN GLASS NAVIGATION ========= */
        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1300px;
            background: rgba(5, 9, 20, 0.75);
            backdrop-filter: blur(18px);
            border-radius: 60px;
            padding: 0.9rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .navbar.scrolled {
            top: 0;
            border-radius: 0 0 30px 30px;
            width: 100%;
            background: rgba(5, 9, 20, 0.95);
            border-top: none;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 2rem;
            color: var(--neon-cyan);
            filter: drop-shadow(0 0 8px cyan);
        }

        .logo-text {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.6rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff, var(--neon-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 2.8rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dim);
            font-weight: 600;
            font-size: 0.95rem;
            transition: var(--transition);
            letter-spacing: 0.5px;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--neon-cyan);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 0%;
            height: 2px;
            background: var(--neon-cyan);
            transition: 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            background: linear-gradient(95deg, var(--neon-cyan), var(--neon-purple));
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            color: #010101 !important;
            font-weight: 800 !important;
        }

        .nav-cta:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--neon-cyan);
            color: black !important;
        }

        .menu-btn {
            display: none;
            font-size: 1.8rem;
            background: none;
            border: none;
            color: var(--neon-cyan);
            cursor: pointer;
        }

        /* hero section — cinematic */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 7rem 2rem 4rem;
            position: relative;
        }

        .hero-badge {
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid rgba(0,240,255,0.4);
            border-radius: 100px;
            padding: 0.4rem 1rem;
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 2rem;
            backdrop-filter: blur(4px);
        }

        .hero h1 {
            font-family: 'Syne', sans-serif;
            font-size: 5rem;
            font-weight: 800;
            line-height: 1.1;
            background: linear-gradient(to right, #ffffff, var(--neon-cyan), #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1.5rem;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-dim);
            max-width: 650px;
            margin: 0 auto 2rem;
        }

        .hero-buttons {
            display: flex;
            gap: 1.2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: linear-gradient(95deg, #00f0ff, #3b82f6);
            padding: 0.9rem 2.3rem;
            border-radius: 40px;
            font-weight: 700;
            text-decoration: none;
            color: #0a0a0a;
            transition: 0.2s;
            border: none;
            font-size: 1rem;
            box-shadow: 0 5px 15px rgba(0,240,255,0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 1.5px solid var(--neon-cyan);
            padding: 0.9rem 2.3rem;
            border-radius: 40px;
            font-weight: 700;
            text-decoration: none;
            color: var(--neon-cyan);
            transition: 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,240,255,0.5);
        }

        .btn-secondary:hover {
            background: rgba(0,240,255,0.1);
            transform: translateY(-3px);
        }

        /* sections */
        section {
            padding: 6rem 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            font-family: 'Syne', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title span {
            color: var(--neon-cyan);
            text-shadow: 0 0 5px rgba(0,240,255,0.5);
        }

        /* about modern grid */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 3rem;
            border: 1px solid var(--glass-border);
        }

        .about-stats {
            display: flex;
            gap: 2rem;
            margin-top: 2rem;
        }

        .stat {
            background: rgba(0,0,0,0.5);
            padding: 1rem;
            border-radius: 1rem;
            text-align: center;
            flex: 1;
            border-left: 3px solid var(--neon-cyan);
        }

        .stat h4 {
            font-size: 2rem;
            color: var(--neon-cyan);
        }

        /* service cards premium */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .service-card {
            background: rgba(10, 25, 47, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 2rem;
            transition: var(--transition);
            border: 1px solid rgba(0,240,255,0.2);
        }

        .service-card:hover {
            transform: translateY(-12px);
            border-color: var(--neon-cyan);
            box-shadow: 0 20px 35px -12px rgba(0,240,255,0.2);
        }

        .service-icon {
            font-size: 2.8rem;
            color: var(--neon-cyan);
            margin-bottom: 1rem;
        }

        .service-card h3 {
            font-size: 1.6rem;
            margin-bottom: 1rem;
        }

        /* work order form - elevated */
        .form-wrapper {
            background: radial-gradient(circle at 10% 30%, rgba(0,240,255,0.08), transparent);
            border-radius: 2.5rem;
            padding: 3rem;
            border: 1px solid rgba(0,240,255,0.3);
            max-width: 800px;
            margin: 0 auto;
        }

        .input-group {
            margin-bottom: 1.8rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.6rem;
            font-weight: 600;
            color: var(--neon-cyan);
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 1.2rem;
            color: white;
            font-size: 1rem;
            transition: 0.2s;
        }

        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0,240,255,0.3);
        }

        button[type="submit"] {
            background: linear-gradient(95deg, #00f0ff, #3b82f6);
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 2rem;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        /* footer */
        footer {
            text-align: center;
            padding: 3rem;
            border-top: 1px solid rgba(0,240,255,0.2);
            background: #02040c;
            color: var(--text-dim);
        }

        /* animation reveal */
        .reveal {
            opacity: 0;
            transform: translateY(35px);
            transition: all 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* responsive */
        @media (max-width: 900px) {
            .navbar {
                width: 95%;
                padding: 0.8rem 1.5rem;
            }
            .nav-links {
                position: fixed;
                top: 0;
                right: -100%;
                height: 100vh;
                width: 70%;
                background: #050b18f2;
                backdrop-filter: blur(20px);
                flex-direction: column;
                justify-content: center;
                gap: 2rem;
                transition: 0.4s;
                border-left: 1px solid cyan;
                z-index: 999;
            }
            .nav-links.active {
                right: 0;
            }
            .menu-btn {
                display: block;
                z-index: 1001;
            }
            .hero h1 {
                font-size: 2.8rem;
            }
            .about-grid {
                grid-template-columns: 1fr;
                padding: 1.5rem;
            }
            .section-title {
                font-size: 2.2rem;
            }
        }

        @media (max-width: 550px) {
            .hero h1 { font-size: 2rem; }
        }
    </style>
</head>

<script>
    // INTERACTIVITY: SCROLL NAV, MOBILE MENU, REVEAL ANIMATIONS, SMOOTH SCROLL
    const navbar = document.getElementById('navbar');
    const menuBtn = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    
    window.addEventListener('scroll', () => {
        if (window.scrollY > 50) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    });

    menuBtn.addEventListener('click', () => {
        navLinks.classList.toggle('active');
        const icon = menuBtn.querySelector('i');
        if (navLinks.classList.contains('active')) {
            icon.classList.remove('fa-bars');
            icon.classList.add('fa-times');
        } else {
            icon.classList.remove('fa-times');
            icon.classList.add('fa-bars');
        }
    });

    document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => {
            navLinks.classList.remove('active');
            const icon = menuBtn.querySelector('i');
            icon.classList.remove('fa-times');
            icon.classList.add('fa-bars');
        });
    });

    // SMOOTH SCROLL WITH OFFSET FOR FIXED NAV
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function(e) {
            e.preventDefault();
            const targetId = this.getAttribute('href');
            if (targetId === "#") return;
            const target = document.querySelector(targetId);
            if (target) {
                const offset = 90;
                const elementPos = target.getBoundingClientRect().top + window.scrollY;
                window.scrollTo({ top: elementPos - offset, behavior: 'smooth' });
            }
        });
    });

    // REVEAL ANIMATION ON SCROLL (Intersection Observer)
    const reveals = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('active');
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.1, rootMargin: "0px 0px -30px 0px" });
    reveals.forEach(el => observer.observe(el));

    // LIVE YEAR UPDATE IN FOOTER? not needed but subtle
    console.log("⚡ Fortress Next-Gen Interface — Operational");
</script>
